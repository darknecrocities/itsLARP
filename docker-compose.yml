services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: larp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-larp_dev_only}
      POSTGRES_DB: itslarp
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
